version: "3.8"

# ==============================================================================
# Synapse: Adaptive Engineering Memory Platform - Docker Compose
# Orchestrates FastAPI Context Engine and Optional Neo4j Graph Database (Phase 17)
# ==============================================================================

services:
  synapse-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse-api
    restart: unless-stopped
    ports:
      - "${SYNAPSE_PORT:-8000}:8000"
    environment:
      - SYNAPSE_ENV=${SYNAPSE_ENV:-production}
      - SYNAPSE_HOST=0.0.0.0
      - SYNAPSE_PORT=8000
      - SYNAPSE_REQUIRE_AUTH=${SYNAPSE_REQUIRE_AUTH:-false}
      - SYNAPSE_SECRET_KEY=${SYNAPSE_SECRET_KEY:-synapse-insecure-dev-secret-key-32chars-min-length-12345}
      - SYNAPSE_DB_PATH=/app/data/synapse_team_memory.db
      - SYNAPSE_CORS_ORIGINS=${SYNAPSE_CORS_ORIGINS:-*}
      - SYNAPSE_REQUEST_TIMEOUT=${SYNAPSE_REQUEST_TIMEOUT:-30.0}
      - SYNAPSE_MAX_PAYLOAD_BYTES=${SYNAPSE_MAX_PAYLOAD_BYTES:-10485760}
      - SYNAPSE_LOG_LEVEL=${SYNAPSE_LOG_LEVEL:-INFO}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-synapse-graph-secret-password-123}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - synapse_data:/app/data
      - synapse_graph:/app/graphify-out
      - synapse_backups:/app/backups
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional dedicated graph database service for heavy enterprise deployments
  neo4j:
    image: neo4j:5.26-community
    container_name: synapse-neo4j
    restart: unless-stopped
    profiles:
      - full
      - graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-synapse-graph-secret-password-123}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  synapse_data:
    name: synapse_data
  synapse_graph:
    name: synapse_graph
  synapse_backups:
    name: synapse_backups
  neo4j_data:
    name: neo4j_data
